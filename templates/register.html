{% extends "base.html" %}
{% block title %}{{ _('Регистрация') }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/register.css">

<div class="register-container bg-white shadow-sm p-4 p-md-5 rounded mx-auto mt-4">
  <h2 class="text-center mb-4">{{ _('Регистрация') }}</h2>
  <form method="post" action="/register">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="surname" class="form-label">{{ _('Фамилия') }}</label>
        <input type="text" class="form-control" id="surname" name="surname" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="name" class="form-label">{{ _('Имя') }}</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">{{ _('Электронная почта') }}</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="password" class="form-label">{{ _('Пароль') }}</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="confirm_password" class="form-label">{{ _('Подтвердите пароль') }}</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
      </div>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
      <label class="form-check-label" for="agree">
        {{ _('Я согласен на обработку моих персональных данных') }}
      </label>
    </div>

    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="recaptcha" name="recaptcha" required>
      <label class="form-check-label" for="recaptcha">
        {{ _('Я не робот') }}
      </label>
    </div>

    <button type="submit" class="btn btn-primary w-100">{{ _('Регистрация') }}</button>
  </form>
</div>
{% endblock %}
