{% extends "iframe_base.html" %}
{% block title %}All Authors{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">All Authors</h4>
  <div>
    <form action="{{ url_for('update_authors') }}" method="post" class="d-inline">
      <button type="submit" class="btn btn-primary">Update from Scraper</button>
    </form>
  </div>
</div>

<div class="mb-3">
  <input type="text" id="authorSearch" class="form-control" placeholder="Search authors...">
</div>

<ul class="list-group" id="authorsList">
  {% for author in authors %}
    <li class="list-group-item list-group-item-action border-secondary">
      {{ author.name }}
      {% if author.affiliation %}
        <span class="text-muted"> — {{ author.affiliation }}</span>
      {% endif %}
    </li>
  {% endfor %}
</ul>

<script src="/static/admin_panel.js"></script>
{% endblock %}
