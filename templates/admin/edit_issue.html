{% extends "iframe_base.html" %}
{% block title %}Edit Issue{% endblock %}
{% block content %}
<h4 class="mb-3">Edit Issue #{{ issue.id }}</h4>

<form method="post">
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" name="title" class="form-control" value="{{ issue.title }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Year</label>
    <input type="number" name="year" class="form-control" value="{{ issue.year }}">
  </div>

  <div class="mb-3">
    <label class="form-label">PDF URL</label>
    <input type="text" name="pdf_url" class="form-control" value="{{ issue.pdf_url }}">
  </div>

  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="submit" name="delete" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this issue?')">Delete</button>
  </div>
</form>
{% endblock %}
