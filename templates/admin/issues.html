{% extends "iframe_base.html" %}
{% block title %}All Issues{% endblock %}
{% block content %}
<h4>All Issues</h4>
<ul class="list-group">
  {% for issue in issues %}
    <li class="list-group-item border-secondary">
      Issue #{{ issue.id }} — {{ issue.title or "Untitled" }} ({{ issue.year }})
    </li>
  {% endfor %}
</ul>
{% endblock %}
