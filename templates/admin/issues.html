{% extends "iframe_base.html" %}
{% block title %}All Issues{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">All Issues</h4>
  <a href="/admin/issues/new" class="btn btn-success">Add issue</a>
</div>

<ul class="list-group">
  {% for issue in issues %}
    <a href="/admin/issues/{{ issue.id }}" class="list-group-item list-group-item-action border-secondary">
      Issue #{{ issue.id }} — {{ issue.title or "Untitled" }} ({{ issue.year }})
    </a>
  {% endfor %}
</ul>
{% endblock %}
