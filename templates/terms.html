{% extends "base.html" %}
{% block title %}{{ _("Terms of Use") }}{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="text-center mb-4">{{ _("Terms of Use") }}</h2>
    <div class="card shadow-lg">
        <div class="card-body text-center">
            <iframe src="{{ url_for('static', filename='pdf/terms_of_use_quaternary.pdf') }}"
                    width="100%" height="800px"
                    style="border: none; border-radius: 12px;">
            </iframe>

            <div class="mt-3">
                <a class="btn btn-outline-primary"
                   href="{{ url_for('static', filename='pdf/terms_of_use_quaternary.pdf') }}"
                   target="_blank">
                   {{ _("Download PDF") }}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
