{% extends "base.html" %}
{% block title %}{{ _('Contact Us') }}{% endblock %}
{% block content %}
<div class="container mt-5 text-center">
    <h2>{{ _("Contact Us") }}</h2>
    <p class="mt-3">
        {{ _("If you want to contact us, please send an email to") }}
        <strong>{{ email }}</strong>
    </p>
    <a href="mailto:{{ email }}" class="btn btn-primary mt-3">
        {{ _("Send Email") }}
    </a>
</div>
{% endblock %}
